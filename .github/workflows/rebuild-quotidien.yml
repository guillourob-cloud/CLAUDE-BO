name: Rebuild quotidien

# Republie le Worker une fois par jour, pour que le calendrier de
# disponibilités (flux iCal) reste à jour même sans nouveau commit. Sans
# effet visible tant que build.py ne récupère pas encore les flux iCal —
# voir MISE-EN-LIGNE.md.
#
# Le projet est un Cloudflare Worker (pas Pages) : il n'y a pas de "Deploy
# Hook" à appeler, ce flux construit et publie donc lui-même via wrangler.
# Nécessite deux secrets de dépôt :
#   CLOUDFLARE_API_TOKEN   jeton avec la permission "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  identifiant de compte Cloudflare
# Voir MISE-EN-LIGNE.md pour savoir où les trouver.

on:
  schedule:
    - cron: "0 4 * * *"   # 4 h UTC chaque jour
  workflow_dispatch: {}    # bouton "Run workflow" pour tester manuellement

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Génère le site
        run: SORTIE=dist python3 build.py

      - name: Publie sur Cloudflare (Worker claude-bo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents — voir MISE-EN-LIGNE.md"
            exit 1
          fi
          npx wrangler deploy
